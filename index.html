<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant a Tree Campaign</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 font-sans text-gray-800">

  <!-- Navbar -->
  <header class="bg-green-900 text-white">
    <div class="container mx-auto flex items-center justify-between py-4 px-6">
      <a href="#" class="font-bold text-xl">Green Earth</a>
      <nav class="space-x-6 hidden md:flex">
        <a href="#" class="hover:text-yellow-300">About</a>
        <a href="#" class="hover:text-yellow-300">Gallery</a>
        <a href="#" class="hover:text-yellow-300">Plant a Tree</a>
      </nav>
      <button class="bg-yellow-400 text-green-900 px-4 py-2 rounded-lg font-semibold hover:bg-yellow-300">
        Plant a Tree
      </button>
    </div>
  </header>

  <!-- Banner Section-->
<section class="bg-green-100 relative text-center py-16 overflow-hidden">
  <img src="assets/hero-leaf1.png"
       alt="Leaf Left"
       class="absolute bottom-0 left-0 h-40 md:h-56 object-contain">

  <img src="assets/hero-leaf2.png"
       alt="Leaf Right"
       class="absolute bottom-0 right-0 h-40 md:h-56 object-contain">

  <div class="relative z-10">
    <h1 class="text-4xl md:text-5xl font-bold">Plant a Tree, Grow a Future</h1>
    <p class="mt-4">
      <button class="bg-yellow-400 text-green-900 px-6 py-3 rounded-lg font-semibold hover:bg-yellow-300">
        Get Involved
      </button>
    </p>
  </div>
</section>

  

</body>
</html>
